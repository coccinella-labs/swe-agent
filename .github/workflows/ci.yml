name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the sandbox image
        run: docker build -f docker/sandbox.Dockerfile -t coccinella-labs/swe-agent-sandbox:smoke .

      - name: Smoke the container contract
        run: |
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,size=512m \
            --user 1001:1001 \
            --memory 4g --memory-swap 4g \
            --cpus 2 --pids-limit 256 \
            -v "$PWD:/work:rw" -w /work \
            coccinella-labs/swe-agent-sandbox:smoke \
            ruff check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
